[project]
name = "data-analysts"
version = "0.1.0"
description = "Portable DataAnalysts runtime for MongoDB to PIT parquet artifacts."
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=15",
  "pymongo>=4",
]

[project.optional-dependencies]
test = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
